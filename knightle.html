<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knightle</title>
<style>
:root{
  --bg:#1b1c20; --panel:#25262c; --panel2:#2e3037; --line:#3a3c45;
  --text:#e6e6ea; --dim:#9a9ca8; --accent:#e8b04a; --good:#4cc38a; --bad:#e5645c;
  --font:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 var(--font);
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:680px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.5rem;margin:0}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:16px}
.stats{color:var(--dim);font-size:.9rem}
.stats b{color:var(--accent);font-size:1.1rem}
.bar{height:4px;background:var(--panel2);border-radius:2px;margin-bottom:18px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}

.msg{background:var(--panel);border-radius:8px;padding:12px 14px;margin-bottom:8px;border-left:3px solid var(--accent);overflow-wrap:anywhere}
.msg .when{color:var(--dim);font-size:.78rem;margin-bottom:2px}
.msg img.att{max-width:100%;max-height:300px;border-radius:6px;display:block;margin-top:6px}
.msg .file{display:inline-block;margin-top:6px;padding:4px 8px;background:var(--panel2);border-radius:4px;font-size:.85rem;color:var(--dim)}
img.emoji{height:1.4em;vertical-align:-.3em}
.mention{background:#3b4270;border-radius:3px;padding:0 3px}

.hints{display:flex;flex-direction:column;gap:6px;margin:14px 0}
.hint{background:var(--panel);border:1px dashed var(--line);border-radius:8px;padding:9px 12px;display:flex;align-items:center;gap:10px;min-height:42px}
.hint.on{border-style:solid}
.hint .k{color:var(--dim);min-width:92px;font-size:.85rem}
.swatch{width:18px;height:18px;border-radius:50%;border:1px solid #fff4;display:inline-block;vertical-align:middle;margin-right:6px}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:8px 14px;background:var(--panel2);color:var(--text)}
button:hover:not(:disabled){background:#3a3d47}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--accent);color:#1b1c20;font-weight:700}
button.primary:hover:not(:disabled){background:#f2c067}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.search{position:relative;margin-top:6px}
.search input{width:100%;font:inherit;padding:11px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text)}
.list{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--panel);border:1px solid var(--line);border-radius:8px;max-height:280px;overflow-y:auto;z-index:5;display:none}
.list.open{display:block}
.list div{padding:8px 12px;display:flex;align-items:center;gap:10px;cursor:pointer}
.list div:hover,.list div.sel{background:var(--panel2)}
.list img,.who img{width:28px;height:28px;border-radius:50%;background:var(--panel2);object-fit:cover}
.list small{color:var(--dim)}
.cost{color:var(--dim);font-size:.85rem;margin-top:8px}
.wrong{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
.wrong span{background:#4a2b2b;color:#f1a29c;border-radius:12px;padding:2px 10px;font-size:.85rem;text-decoration:line-through}

.reveal{background:var(--panel);border-radius:10px;padding:16px;margin-top:16px;text-align:center}
.reveal .who{display:flex;justify-content:center;align-items:center;gap:10px;font-size:1.15rem;font-weight:700}
.reveal .who img{width:44px;height:44px}
.reveal .pts{font-size:1.8rem;font-weight:700;margin:8px 0}
.reveal .pts.good{color:var(--good)} .reveal .pts.bad{color:var(--bad)}
.end{text-align:center}
.end .big{font-size:3.2rem;font-weight:700;color:var(--accent);line-height:1.1}
.rows{text-align:left;margin:18px 0;background:var(--panel);border-radius:8px}
.rows div{display:flex;justify-content:space-between;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line)}
.rows div:last-child{border:0}
.center{text-align:center;color:var(--dim);padding:40px 0}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<main>
  <div class="top"><h1>Knightle</h1><div class="stats" id="stats"></div></div>
  <div class="bar"><i id="bar" style="width:0"></i></div>
  <div id="app" class="center">Loading messages…</div>
</main>
<script src="game.js"></script>
</body>
</html>
